<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#162d50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pluginGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2564;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8899aa" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="700">ShadowMe 系统架构</text>

  <!-- Web Frontend Box -->
  <rect x="40" y="80" width="240" height="300" rx="12" fill="url(#webGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="160" y="115" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">🖥️ 网页管理端</text>
  <line x1="70" y1="130" x2="250" y2="130" stroke="#ffffff33" stroke-width="1"/>
  <text x="70" y="160" fill="#ffffffcc" font-size="13">Next.js 16 (App Router)</text>
  <text x="70" y="185" fill="#ffffffcc" font-size="13">Tailwind CSS 4</text>
  <text x="70" y="210" fill="#ffffffcc" font-size="13">Framer Motion</text>
  <text x="70" y="235" fill="#ffffffcc" font-size="13">React Context + useReducer</text>
  <line x1="70" y1="255" x2="250" y2="255" stroke="#ffffff33" stroke-width="1"/>
  <text x="70" y="280" fill="#ffffff99" font-size="12">📋 看板界面</text>
  <text x="70" y="305" fill="#ffffff99" font-size="12">💬 实时消息</text>
  <text x="70" y="330" fill="#ffffff99" font-size="12">📊 统计面板</text>
  <text x="70" y="355" fill="#ffffff99" font-size="12">🔔 通知推送</text>

  <!-- Backend API Box -->
  <rect x="330" y="80" width="240" height="300" rx="12" fill="url(#apiGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="450" y="115" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">⚙️ 后台服务</text>
  <line x1="360" y1="130" x2="540" y2="130" stroke="#ffffff33" stroke-width="1"/>
  <text x="360" y="160" fill="#ffffffcc" font-size="13">API Routes (REST)</text>
  <text x="360" y="185" fill="#ffffffcc" font-size="13">sql.js (SQLite WASM)</text>
  <text x="360" y="210" fill="#ffffffcc" font-size="13">SSE 实时推送</text>
  <text x="360" y="235" fill="#ffffffcc" font-size="13">Zod 参数校验</text>
  <line x1="360" y1="255" x2="540" y2="255" stroke="#ffffff33" stroke-width="1"/>
  <text x="360" y="280" fill="#ffffff99" font-size="12">📡 /api/tasks</text>
  <text x="360" y="305" fill="#ffffff99" font-size="12">📡 /api/shadow/status</text>
  <text x="360" y="330" fill="#ffffff99" font-size="12">📡 /api/sse</text>
  <text x="360" y="355" fill="#ffffff99" font-size="12">📡 /api/webhook/cc</text>

  <!-- Plugin Box -->
  <rect x="620" y="80" width="240" height="300" rx="12" fill="url(#pluginGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="740" y="115" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">🤖 Claude Code 插件</text>
  <line x1="650" y1="130" x2="830" y2="130" stroke="#ffffff33" stroke-width="1"/>
  <text x="650" y="160" fill="#ffffffcc" font-size="13">Plugin SDK</text>
  <text x="650" y="185" fill="#ffffffcc" font-size="13">WebSocket + HTTP</text>
  <text x="650" y="210" fill="#ffffffcc" font-size="13">Skills 技能系统</text>
  <text x="650" y="235" fill="#ffffffcc" font-size="13">GitLab API 集成</text>
  <line x1="650" y1="255" x2="830" y2="255" stroke="#ffffff33" stroke-width="1"/>
  <text x="650" y="280" fill="#ffffff99" font-size="12">🔮 /shadowme:status</text>
  <text x="650" y="305" fill="#ffffff99" font-size="12">📋 /shadowme:list-tasks</text>
  <text x="650" y="330" fill="#ffffff99" font-size="12">🎯 /shadowme:take-task</text>
  <text x="650" y="355" fill="#ffffff99" font-size="12">✅ /shadowme:complete-task</text>

  <!-- Arrows -->
  <line x1="280" y1="200" x2="328" y2="200" stroke="#8899aa" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="304" y="192" text-anchor="middle" fill="#8899aa" font-size="10">HTTP</text>

  <line x1="570" y1="200" x2="618" y2="200" stroke="#8899aa" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="594" y="192" text-anchor="middle" fill="#8899aa" font-size="10">SSE/WS</text>

  <line x1="618" y1="260" x2="570" y2="260" stroke="#e94560" stroke-width="2" marker-end="url(#arrowWhite)" stroke-dasharray="6,3"/>
  <text x="594" y="252" text-anchor="middle" fill="#e94560" font-size="10">API</text>

  <!-- Database -->
  <rect x="380" y="395" width="140" height="24" rx="6" fill="#0a1628" stroke="#0f3460" stroke-width="1"/>
  <text x="450" y="412" text-anchor="middle" fill="#8899aa" font-size="11">🗄️ SQLite (sql.js)</text>
</svg>
