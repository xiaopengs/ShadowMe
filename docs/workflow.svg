<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="700">ShadowMe 工作流程</text>

  <!-- Step 1: Create Task -->
  <rect x="30" y="70" width="110" height="80" rx="10" fill="#e94560" filter="url(#shadow)" opacity="0.95"/>
  <text x="85" y="100" text-anchor="middle" fill="#fff" font-size="22">📋</text>
  <text x="85" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">创建任务</text>
  <text x="85" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">pending</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="110" x2="168" y2="110" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Store -->
  <rect x="170" y="70" width="110" height="80" rx="10" fill="#0f3460" filter="url(#shadow)" opacity="0.95"/>
  <text x="225" y="100" text-anchor="middle" fill="#fff" font-size="22">🗄️</text>
  <text x="225" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">任务入库</text>
  <text x="225" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">SQLite</text>

  <!-- Arrow 2→3 -->
  <line x1="280" y1="110" x2="308" y2="110" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: SSE Push -->
  <rect x="310" y="70" width="110" height="80" rx="10" fill="#533483" filter="url(#shadow)" opacity="0.95"/>
  <text x="365" y="100" text-anchor="middle" fill="#fff" font-size="22">📡</text>
  <text x="365" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">实时推送</text>
  <text x="365" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">SSE</text>

  <!-- Arrow 3→4 -->
  <line x1="420" y1="110" x2="448" y2="110" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Shadow Receive -->
  <rect x="450" y="70" width="110" height="80" rx="10" fill="#533483" filter="url(#shadow)" opacity="0.95"/>
  <text x="505" y="100" text-anchor="middle" fill="#fff" font-size="22">🤖</text>
  <text x="505" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">分身接收</text>
  <text x="505" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">Plugin</text>

  <!-- Arrow 4→5 -->
  <line x1="560" y1="110" x2="588" y2="110" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Execute -->
  <rect x="590" y="70" width="110" height="80" rx="10" fill="#e94560" filter="url(#shadow)" opacity="0.95"/>
  <text x="645" y="100" text-anchor="middle" fill="#fff" font-size="22">⚡</text>
  <text x="645" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">开始执行</text>
  <text x="645" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">in_progress</text>

  <!-- Arrow 5→6 -->
  <line x1="700" y1="110" x2="728" y2="110" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Complete -->
  <rect x="730" y="70" width="110" height="80" rx="10" fill="#0f3460" filter="url(#shadow)" opacity="0.95"/>
  <text x="785" y="100" text-anchor="middle" fill="#fff" font-size="22">✅</text>
  <text x="785" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">完成回传</text>
  <text x="785" y="142" text-anchor="middle" fill="#ffffffaa" font-size="9">completed</text>

  <!-- Bottom: Actor labels -->
  <rect x="30" y="190" width="810" height="2" rx="1" fill="#ffffff15"/>

  <!-- Colleague row -->
  <rect x="30" y="210" width="250" height="50" rx="8" fill="#e9456022" stroke="#e94560" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="155" y="240" text-anchor="middle" fill="#e94560" font-size="12" font-weight="600">👤 同事 — 创建任务 &amp; 查看结果</text>

  <!-- System row -->
  <rect x="310" y="210" width="250" height="50" rx="8" fill="#0f346022" stroke="#0f3460" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="435" y="240" text-anchor="middle" fill="#5588bb" font-size="12" font-weight="600">⚙️ 系统 — 存储 &amp; 推送</text>

  <!-- AI row -->
  <rect x="590" y="210" width="250" height="50" rx="8" fill="#53348322" stroke="#533483" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="715" y="240" text-anchor="middle" fill="#9966cc" font-size="12" font-weight="600">🤖 AI 分身 — 接收 &amp; 执行</text>

  <!-- Task Status Flow -->
  <text x="450" y="300" text-anchor="middle" fill="#8899aa" font-size="13">
    🟡 pending → 🔵 in_progress → 🟢 completed → ⚪ closed
  </text>

  <!-- Loop arrow -->
  <path d="M 840 150 Q 870 200 840 250 Q 810 300 450 310 Q 60 300 40 250 Q 20 200 40 150" 
        fill="none" stroke="#ffffff22" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="855" y="200" fill="#ffffff44" font-size="10" transform="rotate(90, 855, 200)">新任务循环</text>
</svg>
